<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | StoreGo</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">🛍️ StoreGo</div>
        <nav class="nav-links">
            <a href="/catalog">Каталог</a>
            <a href="/cart">Корзина</a>
            <a href="/profile" class="active">Профиль</a>
            <a href="/logout" class="logout-btn">Выйти</a>
        </nav>
    </header>

    <main class="container-catalog">
        <h1>Личный кабинет</h1>

        <div class="product-card" style="max-width: 500px; margin-bottom: 24px;">
            <div class="product-info">
                <h3>Добро пожаловать, {{.Name}}!</h3>
                <p class="stock" style="margin-bottom: 16px;">Никнейм: @{{.Username}}</p>
            </div>
            <a href="/profile/product/add" class="buy-btn" style="text-align: center; text-decoration: none; display: block;">Добавить новый товар</a>
        </div>
    </main>
</body>
</html>
