<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить товар | StoreGo</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">🛍️ StoreGo</div>
        <nav class="nav-links">
            <a href="/profile">Профиль</a>
            <a href="/catalog">Каталог</a>
            <a href="/cart">Корзина</a>
            <a href="/logout" class="logout-btn">Выйти</a>
        </nav>
    </header>

    <main style="display: flex; justify-content: center; align-items: center; flex: 1; padding: 40px 20px;">
        <div class="container" style="max-width: 480px;">
            <h2>Добавление товара</h2>

            <form action="profile/product/add" method="POST">
                <div class="form-group">
                    <label>Название товара</label>
                    <input type="text" name="name" placeholder="Введите название" required>
                </div>

                <div class="form-group">
                    <label>Цена</label>
                    <input type="number" step="0.01" name="price" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label>Описание</label>
                    <input type="text" name="description" placeholder="input product description..." required>
                </div>

                <div class="form-group">
                    <label>Количество на складе</label>
                    <input type="number" name="stock" placeholder="0" required>
                </div>

                <button type="submit">Добавить товар</button>
            </form>
        </div>
    </main>
</body>
</html>
